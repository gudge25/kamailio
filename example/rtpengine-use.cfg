
listen=udp:eth0:5060
# ---------- Load Modules ----------
loadmodule "pv.so" # PV module for variable manipulation
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "xlog.so"
loadmodule "rtpengine.so"
loadmodule "textops.so"

# ---------- Set RTPengine socket ----------
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

# ---------- Main Request Route ----------
request_route {
    xlog("L_ALERT", ">>> $rm from $si:$sp\n");

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("REGISTER")) {
        sl_send_reply("200", "Registered");
        exit;
    }

    if (is_method("INVITE") && has_body("application/sdp")) {
        record_route();  # Record-Route INVITE requests
        rtpengine_manage();
        t_on_reply("RTPE_REPLY");
        t_on_failure("FAILURE_RTPE");
    }

    if (is_method("BYE|CANCEL")) {
        rtpengine_manage();  # will automatically call delete
    }

    t_relay();
    exit;
}

# ---------- Reply Route ----------
onreply_route[RTPE_REPLY] {
    if (has_body("application/sdp")) {
        rtpengine_manage();  # will automatically do answer
    }
}

# ---------- Failure Route ----------
failure_route[FAILURE_RTPE] {
    xlog("L_WARN", "Call failed: cleaning up RTP\n");
    rtpengine_manage();  # will call delete
}