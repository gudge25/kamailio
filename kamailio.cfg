#!KAMAILIO

# *** To enable mysql:
#!define WITH_MYSQL

####### Include Local Config If Exists #########
import_file "kamailio-local.cfg"

####### Defined Values #########

#!ifdef WITH_MYSQL
loadmodule "db_mysql.so" # Load MySQL database module
#!trydef DBURL "mysql://MYSQL_USER:MYSQL_PASS@MYSQL_HOST:MYSQL_PORT/kamailio"
#!endif

####### Global Parameters #########

# Server header to be used in replies
server_header="Server: StandWithUkraine"

/* LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR, ... */
debug=2

/* set to 'yes' to print log messages to terminal or use '-E' cli option */
log_stderror=no

memdbg=5
memlog=5

log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

/* number of SIP routing processes for each UDP socket
 * - value inherited by tcp_children and sctp_children when not set explicitely */
children=8

/* uncomment the next line to disable TCP (default on) */
disable_tcp=yes

/* uncomment the next line to disable the auto discovery of local aliases
 * based on reverse DNS on IPs (default on) */
auto_aliases=no

/* add local domain aliases - it can be set many times */
# alias="sip.mydomain.com"

/* listen sockets - if none set, Kamailio binds to all local IP addresses
 * - basic prototype (full prototype can be found in Wiki - Core Cookbook):
 *      listen=[proto]:[localip]:[lport] advertise [publicip]:[pport]
 * - it can be set many times to add more sockets to listen to */
listen=udp:eth0:5060 advertise ADV_HOST:5060

 ####### Modules Section ########
loadmodule "pv.so" # PV module for variable manipulation
loadmodule "tm.so" # Transaction module for SIP transactions
loadmodule "sl.so" # Stateless module for stateless requests
loadmodule "xlog.so" # XLOG module for logging
loadmodule "maxfwd.so" # Max-Forwards header processing module
loadmodule "textops.so" # Text operations module for string manipulation
loadmodule "rr.so" # Record-Route module for handling Record-Route headers
loadmodule "siputils.so" # SIP utilities module for SIP message handling
loadmodule "sanity.so" # Sanity module for basic request checks
loadmodule "nathelper.so" # NAT helper module for handling NAT-related issues
#loadmodule "mangler.so" # Mangler module for manipulating SIP messages
loadmodule "textopsx.so"

####### Module Parameters ########
modparam("tm", "auto_inv_100", 1) # Automatically send 100 Trying for INVITE requests
modparam("tm", "auto_inv_100_reason", "Trying") # Reason phrase for 100 Trying

modparam("sanity", "noreply", 1) 

# params needed for NAT traversal in other modules

