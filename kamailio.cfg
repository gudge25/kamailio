route[REQINIT] {

    # initial sanity checks -- messages with
	# max_forwards==0, or excessively long requests
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	};
	if (msg:len >= 2048 ) {
		sl_send_reply("513", "Message too big");
		exit;
	};
    if(!sanity_check("1024", "6")) {
        xdbg("sanity checks failed\n");
        sanity_reply();
        exit;
    }
    # Force rport in Via header
    #force_rport();
}

route[REGISTRAR] {
    if (!is_method("REGISTER")) return;
    # add_contact_alias("enc_ct", ADV_HOST, 5060);
    if (nat_uac_test("19")) {
        xlog("L_INFO", "NAT detected for REGISTER request\n");
        fix_nated_contact();
        msg_apply_changes();
    }
    encode_contact("proxy_ip", ADV_HOST);
    t_relay();
    exit;
}

onreply_route[MANAGE_REPLY] {
    fix_nated_contact();
    if (has_body("application/sdp") && status=~"200") {
        fix_nated_sdp("10");  # 0x02 + 0x08
    }
}